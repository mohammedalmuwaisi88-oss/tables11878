<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS GAMING</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <h1>NEXUS GAMING</h1>
        <button id="open-add-btn" class="btn-primary">+ إضافة منتج</button>
    </header>

    <main class="products-grid" id="products-container">
        <!-- المنتجات بتظهر هنا -->
    </main>

    <!-- النافذة المنبثقة للإضافة والتعديل -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-card">
            <span id="close-modal-btn" class="close-btn">&times;</span>
            <h2 id="modal-title">إضافة منتج</h2>
            
            <form id="product-form">
                <input type="hidden" id="prod-id">
                
                <input type="text" id="prod-name" placeholder="اسم المنتج" required>
                <input type="number" step="0.001" id="prod-price" placeholder="السعر" required>
                <input type="text" id="prod-category" placeholder="القسم (مثال: chairs)" required>
                <input type="url" id="prod-image" placeholder="رابط الصورة" required>
                
                <button type="submit" id="save-btn" class="btn-primary">حفظ</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
