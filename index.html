<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS GAMING | متجر وإدارة المنتجات</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">
                <i class="fa-solid fa-gamepad"></i> NEXUS<span>GAMING</span>
            </a>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="ابحث عن منتج...">
            </div>

            <button class="cart-btn" id="cart-toggle-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-count" id="cart-count">0</span>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>منصة NEXUS GAMING المتكاملة</h1>
            <p>تصفح إكسسوارات القيمنق، وأضف أو عدّل المنتجات مباشرة في قاعدة البيانات</p>
        </div>
    </section>

    <!-- Products Section -->
    <section class="section">
        <div class="section-header">
            <h2 class="section-title">عرض المنتجات</h2>
            <button id="admin-add-btn" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> إضافة منتج جديد
            </button>
        </div>

        <div class="products-grid" id="products-container"></div>
    </section>

    <!-- Cart Drawer -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="drawer-header">
            <h3>سلة المشتريات</h3>
            <span class="close-btn" id="close-cart-btn">&times;</span>
        </div>
        <div class="drawer-body" id="cart-items-container"></div>
        <div class="drawer-footer">
            <div class="subtotal-row">
                <span>الإجمالي:</span>
                <strong id="cart-subtotal">0.000 ر.ع</strong>
            </div>
            <button class="btn btn-primary" id="checkout-start-btn" style="width: 100%;">متابعة الطلب عبر واتساب</button>
        </div>
    </div>

    <!-- Modal: Add or Edit Product -->
    <div class="modal" id="product-form-modal">
        <div class="modal-card">
            <span class="modal-close" id="close-form-modal">&times;</span>
            <h2 id="modal-form-title">إضافة منتج جديد</h2>
            <form id="product-form">
                <input type="hidden" id="prod-id">
                
                <div class="form-group">
                    <label>اسم المنتج</label>
                    <input type="text" id="prod-name" required placeholder="مثال: كرسي قيمنق احترافي">
                </div>
                
                <div class="form-group">
                    <label>القسم</label>
                    <select id="prod-category" required>
                        <option value="desks">Gaming Desks</option>
                        <option value="chairs">Gaming Chairs</option>
                        <option value="accessories">Accessories</option>
                        <option value="setups">Gaming Setup</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>السعر (ر.ع)</label>
                    <input type="number" step="0.001" id="prod-price" required placeholder="مثال: 45.000">
                </div>

                <div class="form-group">
                    <label>رابط الصورة</label>
                    <input type="url" id="prod-image" required placeholder="https://...">
                </div>

                <div class="form-group">
                    <label>الوصف</label>
                    <textarea id="prod-desc" rows="3" placeholder="وصف المنتج..."></textarea>
                </div>

                <div class="form-group">
                    <label>المواصفات</label>
                    <input type="text" id="prod-specs" placeholder="مثال: إمالة 180 درجة | جلد فاخر">
                </div>

                <button type="submit" id="save-product-btn" class="btn btn-primary" style="width: 100%; margin-top: 15px;">حفظ وإرسال لقاعدة البيانات</button>
            </form>
        </div>
    </div>

    <!-- Modal: Checkout Form -->
    <div class="modal" id="checkout-modal">
        <div class="modal-card">
            <span class="modal-close" id="close-checkout-modal">&times;</span>
            <h2>إتمام الطلب عبر واتساب</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="cust-name" required placeholder="أدخل اسمك الكامل">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="cust-phone" required placeholder="مثال: 96872420073">
                </div>
                <div class="form-group">
                    <label>العنوان</label>
                    <input type="text" id="cust-location" required placeholder="المنطقة / الولاية">
                </div>
                <div class="checkout-summary">
                    <span>المبلغ الإجمالي:</span>
                    <strong id="checkout-total">0.000 ر.ع</strong>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">تأكيد وإرسال للواتساب</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 NEXUS GAMING. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- Application Script -->
    <script src="script.js"></script>
</body>
</html>
